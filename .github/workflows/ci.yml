name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test (Windows x64)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # ExactWheel provenance is pinned to an earlier immutable commit.
          # PR merge checkouts must retain that history so the verifier can
          # prove the commit/tree/blob relationship without a shallow bypass.
          fetch-depth: 0

      - name: Anchor bundled HandleScope bytes to the immutable upstream commit
        shell: pwsh
        run: |
          $upstream = Join-Path $env:RUNNER_TEMP 'handlescope-upstream-ef3b9268'
          if (Test-Path -LiteralPath $upstream) {
            throw 'The HandleScope upstream verification directory already exists.'
          }
          New-Item -ItemType Directory -Path $upstream | Out-Null
          & git -C $upstream init --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Unable to initialize the upstream verification repository.' }
          & git -C $upstream remote add origin https://github.com/Makmatoe/HandleScope.git
          if ($LASTEXITCODE -ne 0) { throw 'Unable to pin the upstream HandleScope origin.' }
          & git -C $upstream fetch --no-tags --depth=1 origin `
            refs/tags/v0.3.0:refs/tags/v0.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch the reviewed HandleScope tag.' }
          & ./scripts/Sync-BundledHandleScope.ps1 -UpstreamPath $upstream

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.302'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Install the pinned Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Restore the pinned Velopack CLI
        shell: pwsh
        run: dotnet tool restore

      - name: Validate, build, test, and publish
        shell: pwsh
        run: ./scripts/Build.ps1 -Configuration Release -Runtime win-x64 -OutputDirectory artifacts/ci-publish -CI

      - name: Build and run the test-only isolated runtime smoke
        shell: pwsh
        run: ./scripts/Build-RuntimeSmoke.ps1 -OutputDirectory artifacts/ci-runtime-smoke -TimeoutSeconds 30

      - name: Install Discord release bot dependencies
        working-directory: discord-release-bot
        shell: pwsh
        run: npm ci

      - name: Test the Discord release bot
        working-directory: discord-release-bot
        shell: pwsh
        run: npm test

      - name: Check Discord release bot syntax
        working-directory: discord-release-bot
        shell: pwsh
        run: npm run check

      - name: Audit Discord release bot production dependencies
        working-directory: discord-release-bot
        shell: pwsh
        run: npm audit --omit=dev --audit-level=moderate

      - name: Upload diagnostic build output
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-build-output-${{ github.run_id }}
          path: |
            **/TestResults/**
            artifacts/**
          if-no-files-found: ignore
          retention-days: 3

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
