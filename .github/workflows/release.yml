name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: sessiondock-release-publication
  queue: max
  cancel-in-progress: false

jobs:
  validate-and-build:
    name: Validate and build release input
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release-metadata.outputs.version }}
      tag: ${{ steps.release-metadata.outputs.tag }}
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Anchor bundled HandleScope bytes to the immutable upstream commit
        shell: pwsh
        run: |
          $upstream = Join-Path $env:RUNNER_TEMP 'handlescope-upstream-ef3b9268'
          if (Test-Path -LiteralPath $upstream) {
            throw 'The HandleScope upstream verification directory already exists.'
          }
          New-Item -ItemType Directory -Path $upstream | Out-Null
          & git -C $upstream init --quiet
          if ($LASTEXITCODE -ne 0) { throw 'Unable to initialize the upstream verification repository.' }
          & git -C $upstream remote add origin https://github.com/Makmatoe/HandleScope.git
          if ($LASTEXITCODE -ne 0) { throw 'Unable to pin the upstream HandleScope origin.' }
          & git -C $upstream fetch --no-tags --depth=1 origin `
            refs/tags/v0.3.0:refs/tags/v0.3.0
          if ($LASTEXITCODE -ne 0) { throw 'Unable to fetch the reviewed HandleScope tag.' }
          & ./scripts/Sync-BundledHandleScope.ps1 -UpstreamPath $upstream

      - name: Install the pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Fetch the protected main branch
        shell: pwsh
        run: git fetch --no-tags origin main:refs/remotes/origin/main

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.302'
          cache: true
          cache-dependency-path: |
            **/packages.lock.json

      - name: Validate release metadata and repository policy
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          ./scripts/Verify-Release.ps1 -Tag $env:RELEASE_TAG -RequireTagAtHead
          -RequireMainAtHead -RequireAnnotatedTag -RequireCleanWorkingTree

      - name: Build, test, and publish the application
        shell: pwsh
        run: ./scripts/Build.ps1 -Configuration Release -Runtime win-x64 -OutputDirectory artifacts/release-input/app -CI

      - name: Build and run the separate test-only runtime smoke
        shell: pwsh
        run: ./scripts/Build-RuntimeSmoke.ps1 -OutputDirectory artifacts/release-runtime-smoke -TimeoutSeconds 30

      - name: Publish the descriptor signer
        shell: pwsh
        run: >-
          dotnet publish SessionDock/tools/ReleaseSigner/ReleaseSigner.csproj
          --configuration Release --runtime win-x64 --self-contained true --no-restore
          --output artifacts/release-input/signer
          -p:ContinuousIntegrationBuild=true -p:Deterministic=true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:DebugSymbols=false

      - name: Stage the manifest-selected Velopack CLI
        shell: pwsh
        run: |
          $manifest = Get-Content .config/dotnet-tools.json -Raw | ConvertFrom-Json
          $toolVersion = [string] $manifest.tools.vpk.version
          if ($toolVersion -notmatch '^\d+\.\d+\.\d+$') {
            throw 'The Velopack tool manifest must contain an exact stable version.'
          }
          dotnet tool install vpk --version $toolVersion `
            --tool-path artifacts/release-input/vpk-tool --disable-parallel
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to stage Velopack CLI $toolVersion."
          }

      - name: Stage immutable release metadata
        id: release-metadata
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          [xml] $project = Get-Content SessionDock/SessionDock.csproj -Raw
          $version = @($project.SelectNodes('/Project/PropertyGroup/Version') | ForEach-Object { $_.InnerText } | Where-Object { $_ })
          if (@($version).Count -ne 1) { throw 'Expected exactly one project version.' }
          $tag = $env:RELEASE_TAG
          Copy-Item "SessionDock/ReleaseNotes/$version.en-US.md" artifacts/release-input/notes.md
          Copy-Item SessionDock/Resources/update-public-key.pem artifacts/release-input/update-public-key.pem
          Copy-Item SessionDock/Resources/handlescope-compatibility-bootstrap.json artifacts/release-input/handlescope-compatibility-bootstrap.json
          Copy-Item SessionDock.HandleScope/handlescope-upstream.json artifacts/release-input/handlescope-upstream.json
          Copy-Item SessionDock/SessionDock.csproj artifacts/release-input/application.csproj
          Copy-Item SessionDock/packages.lock.json artifacts/release-input/packages.lock.json
          Copy-Item global.json artifacts/release-input/global.json
          New-Item -ItemType Directory artifacts/release-input/scripts -Force | Out-Null
          Copy-Item scripts/New-ReleaseChecksums.ps1 artifacts/release-input/scripts/New-ReleaseChecksums.ps1
          Copy-Item scripts/New-ReleaseSbom.ps1 artifacts/release-input/scripts/New-ReleaseSbom.ps1
          Copy-Item scripts/Rename-SessionDockReleaseAssets.ps1 artifacts/release-input/scripts/Rename-SessionDockReleaseAssets.ps1
          Copy-Item scripts/ReleaseJson.ps1 artifacts/release-input/scripts/ReleaseJson.ps1
          Copy-Item scripts/Sign-ReleaseDescriptorDigest.ps1 artifacts/release-input/scripts/Sign-ReleaseDescriptorDigest.ps1
          Copy-Item scripts/Verify-Assets.ps1 artifacts/release-input/scripts/Verify-Assets.ps1
          Copy-Item scripts/Verify-ReleaseLicense.ps1 artifacts/release-input/scripts/Verify-ReleaseLicense.ps1
          Copy-Item discord-release-bot/src/release-automation.js artifacts/release-input/release-automation.mjs

          $announcementArguments = @(
            'generate'
            '--version', $version
            '--source-commit', $env:SOURCE_COMMIT
            '--notes', "SessionDock/ReleaseNotes/$version.en-US.md"
            '--output', 'artifacts/release-input/discord-announcement'
          )
          $reviewedImageDirectory = "docs/images/sessiondock-v$version"
          if (Test-Path -LiteralPath "$reviewedImageDirectory/discord.json" -PathType Leaf) {
            $announcementArguments += @('--images', $reviewedImageDirectory)
          }
          & node ./artifacts/release-input/release-automation.mjs @announcementArguments
          if ($LASTEXITCODE -ne 0) { throw 'Unable to generate the immutable Discord announcement.' }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload verified release input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-input-${{ github.sha }}
          path: artifacts/release-input
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 0
          retention-days: 7

  preflight-discord-announcement:
    name: Validate Discord announcement readiness
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-announcement
    permissions: {}
    steps:
      - name: Download immutable release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-${{ github.sha }}
          path: release-input

      - name: Install the pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Verify the deterministic announcement artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-and-build.outputs.tag }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          node ./release-input/release-automation.mjs verify
          --artifact-dir release-input/discord-announcement
          --expected-tag "$RELEASE_TAG"
          --expected-ref "$SOURCE_REF"
          --expected-commit "$SOURCE_COMMIT"

      - name: Read-only preflight of Bota and the release channel
        shell: bash
        env:
          DISCORD_RELEASE_BOT_ID: ${{ vars.DISCORD_RELEASE_BOT_ID }}
          DISCORD_RELEASE_BOT_TOKEN: ${{ secrets.DISCORD_RELEASE_BOT_TOKEN }}
          DISCORD_RELEASE_CHANNEL_ID: ${{ vars.DISCORD_RELEASE_CHANNEL_ID }}
          DISCORD_RELEASE_ROLE_ID: ${{ vars.DISCORD_RELEASE_ROLE_ID }}
          RELEASE_TAG: ${{ needs.validate-and-build.outputs.tag }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          node ./release-input/release-automation.mjs preflight
          --artifact-dir release-input/discord-announcement
          --expected-tag "$RELEASE_TAG"
          --expected-ref "$SOURCE_REF"
          --expected-commit "$SOURCE_COMMIT"

  sign-attest-and-stage:
    name: Sign, attest, and stage verified draft
    needs:
      - validate-and-build
      - preflight-discord-announcement
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-${{ github.sha }}
          path: release-input

      - name: Install the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.302'

      - name: Validate protected release context and license
        shell: pwsh
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
        run: |
          if ($env:SOURCE_REPOSITORY -cne 'Makmatoe/SessionDock') {
            throw 'This workflow may publish only from Makmatoe/SessionDock.'
          }
          & ./release-input/scripts/Verify-ReleaseLicense.ps1 `
            -LicensePath ./release-input/app/LICENSE.md

      - name: Build Velopack assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate-and-build.outputs.version }}
        run: |
          New-Item -ItemType Directory release-output -Force | Out-Null
          # Do not pass Velopack --icon while strict legacy updaters remain
          # supported: Velopack 1.2 adds setup.ico to the full nupkg, which
          # those released clients correctly reject as an unexpected entry.
          & ./release-input/vpk-tool/vpk.exe pack `
            --packId SessionDockApp `
            --packVersion $env:RELEASE_VERSION `
            --packDir ./release-input/app `
            --mainExe SessionDock.exe `
            --packTitle SessionDock `
            --packAuthors Makmatoe `
            --releaseNotes ./release-input/notes.md `
            --runtime win-x64 `
            --channel win-x64-sessiondock `
            --outputDir ./release-output
          if ($LASTEXITCODE -ne 0) { throw "Velopack packaging failed with exit code $LASTEXITCODE." }
          & ./release-input/scripts/Rename-SessionDockReleaseAssets.ps1 `
            -Directory ./release-output `
            -Channel win-x64-sessiondock

      - name: Prepare the canonical unsigned release descriptor
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate-and-build.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-and-build.outputs.tag }}
        run: |
          $package = @(Get-ChildItem release-output -File -Filter *-full.nupkg)
          if ($package.Count -ne 1) { throw "Expected one full package; found $($package.Count)." }
          & ./release-input/signer/ReleaseSigner.exe prepare `
            --package $package[0].FullName `
            --notes ./release-input/notes.md `
            --output ./descriptor.unsigned.json `
            --digest-output ./descriptor.digest.base64url `
            --repository Makmatoe/SessionDock `
            --channel win-x64-sessiondock `
            --version $env:RELEASE_VERSION `
            --tag $env:RELEASE_TAG `
            --identity current
          if ($LASTEXITCODE -ne 0) { throw "Descriptor preparation failed with exit code $LASTEXITCODE." }

      - name: Prepare the canonical unsigned HandleScope compatibility catalog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate-and-build.outputs.version }}
        run: |
          $catalogName = 'sessiondock-handlescope-compatibility.json'
          $catalogHistory = [Collections.Generic.List[object]]::new()
          $catalogAssetIds = [Collections.Generic.HashSet[long]]::new()
          [int] $page = 1
          while ($true) {
            if ($page -gt 100) {
              throw 'Published release history exceeded the bounded catalog freshness search.'
            }
            $releasePageJson = gh api `
              -H 'Accept: application/vnd.github+json' `
              -H 'X-GitHub-Api-Version: 2022-11-28' `
              "/repos/$env:GITHUB_REPOSITORY/releases?per_page=100&page=$page"
            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to inspect published release history for the catalog freshness floor.'
            }
            $releasePage = @($releasePageJson | ConvertFrom-Json)
            foreach ($release in $releasePage) {
              if ($release.draft -or $release.prerelease) { continue }
              $releaseCatalogAssets = @($release.assets | Where-Object {
                  $_.name -ceq $catalogName
                })
              if ($releaseCatalogAssets.Count -gt 1) {
                throw "Published release $($release.tag_name) has an ambiguous catalog asset."
              }
              if ($releaseCatalogAssets.Count -eq 1) {
                $asset = $releaseCatalogAssets[0]
                try {
                  [long] $assetId = $asset.id
                  [long] $assetSize = $asset.size
                }
                catch {
                  throw "Published release $($release.tag_name) has invalid catalog asset metadata."
                }
                $assetDigest = [string] $asset.digest
                if ($assetId -le 0 -or
                    $assetSize -le 0 -or
                    $assetSize -gt 256KB -or
                    $asset.state -cne 'uploaded' -or
                    $assetDigest -cnotmatch '^sha256:[0-9a-f]{64}$' -or
                    -not $catalogAssetIds.Add($assetId)) {
                  throw "Published release $($release.tag_name) has untrusted catalog asset metadata."
                }
                $catalogHistory.Add([pscustomobject]@{
                    AssetId = $assetId
                    Digest = $assetDigest
                    Size = $assetSize
                  })
              }
            }
            if ($releasePage.Count -lt 100) { break }
            $page++
          }
          if ($catalogHistory.Count -eq 0 -and
              $env:RELEASE_VERSION -cne '2.8.0') {
            throw 'Only SessionDock 2.8.0 may establish the first HandleScope catalog sequence.'
          }

          $catalogArguments = @(
            'prepare-catalog'
            '--manifest', './release-input/handlescope-compatibility-bootstrap.json'
            '--output', './handlescope-catalog.unsigned.json'
            '--digest-output', './handlescope-catalog.digest.base64url'
            '--sessiondock-version', $env:RELEASE_VERSION
          )
          if ($catalogHistory.Count -gt 0) {
            if (Test-Path -LiteralPath ./prior-catalog) {
              throw 'The prior catalog staging directory already exists.'
            }
            $priorCatalogDirectory = (New-Item `
                -ItemType Directory `
                -Path ./prior-catalog).FullName
            $assetHeaders = @{
              Accept = 'application/octet-stream'
              Authorization = "Bearer $env:GH_TOKEN"
              'User-Agent' = 'SessionDock-release-workflow'
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            foreach ($historicalAsset in @($catalogHistory |
                Sort-Object AssetId)) {
              $destination = Join-Path `
                $priorCatalogDirectory `
                "$($historicalAsset.AssetId).json"
              try {
                Invoke-WebRequest `
                  -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/assets/$($historicalAsset.AssetId)" `
                  -Headers $assetHeaders `
                  -OutFile $destination `
                  -MaximumRedirection 5 `
                  -TimeoutSec 60
              }
              catch {
                throw "Published catalog asset $($historicalAsset.AssetId) could not be downloaded by immutable ID."
              }
              $downloadedAsset = Get-Item -LiteralPath $destination
              $downloadedDigest = (Get-FileHash `
                  -LiteralPath $destination `
                  -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($downloadedAsset.Length -ne $historicalAsset.Size -or
                  $downloadedDigest -cne
                    $historicalAsset.Digest.Substring(7)) {
                throw "Published catalog asset $($historicalAsset.AssetId) changed after enumeration."
              }
            }
            $priorFiles = @(Get-ChildItem ./prior-catalog -File -Force)
            if ($priorFiles.Count -ne $catalogHistory.Count) {
              throw 'The authenticated catalog history download is incomplete.'
            }
            $catalogArguments += @(
              '--prior-directory', $priorCatalogDirectory
              '--public-key', './release-input/update-public-key.pem'
            )
          }
          & ./release-input/signer/ReleaseSigner.exe @catalogArguments
          if ($LASTEXITCODE -ne 0) { throw "Compatibility catalog preparation failed with exit code $LASTEXITCODE." }

      - name: Sign release metadata with the protected P-256 key
        shell: pwsh
        env:
          UPDATE_SIGNING_PRIVATE_KEY_PKCS8_BASE64: ${{ secrets.UPDATE_SIGNING_PRIVATE_KEY_PKCS8_BASE64 }}
        run: |
          $digests = @(
            './descriptor.digest.base64url'
            './handlescope-catalog.digest.base64url'
          )
          $signatures = @(
            './descriptor.signature.base64url'
            './handlescope-catalog.signature.base64url'
          )
          & ./release-input/scripts/Sign-ReleaseDescriptorDigest.ps1 `
            -DigestPath $digests `
            -SignaturePath $signatures

      - name: Complete and verify the externally signed release descriptor
        shell: pwsh
        run: |
          $package = @(Get-ChildItem release-output -File -Filter *-full.nupkg)
          & ./release-input/signer/ReleaseSigner.exe complete `
            --manifest ./descriptor.unsigned.json `
            --package $package[0].FullName `
            --signature-file ./descriptor.signature.base64url `
            --output ./release-output/sessiondock-release.json `
            --public-key ./release-input/update-public-key.pem
          if ($LASTEXITCODE -ne 0) { throw "External descriptor completion failed with exit code $LASTEXITCODE." }

      - name: Complete and verify the externally signed HandleScope compatibility catalog
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate-and-build.outputs.version }}
        run: |
          & ./release-input/signer/ReleaseSigner.exe complete-catalog `
            --manifest ./handlescope-catalog.unsigned.json `
            --signature-file ./handlescope-catalog.signature.base64url `
            --output ./release-output/sessiondock-handlescope-compatibility.json `
            --public-key ./release-input/update-public-key.pem `
            --sessiondock-version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "External compatibility catalog completion failed with exit code $LASTEXITCODE." }

      - name: Verify the signed descriptor and assemble release metadata
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ needs.validate-and-build.outputs.version }}
        run: |
          $package = @(Get-ChildItem release-output -File -Filter *-full.nupkg)
          & ./release-input/signer/ReleaseSigner.exe verify `
            --manifest ./release-output/sessiondock-release.json `
            --package $package[0].FullName `
            --public-key ./release-input/update-public-key.pem
          if ($LASTEXITCODE -ne 0) { throw "Descriptor verification failed with exit code $LASTEXITCODE." }

          & ./release-input/signer/ReleaseSigner.exe verify-catalog `
            --manifest ./release-output/sessiondock-handlescope-compatibility.json `
            --public-key ./release-input/update-public-key.pem `
            --sessiondock-version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) { throw "Compatibility catalog verification failed with exit code $LASTEXITCODE." }

          & ./release-input/scripts/New-ReleaseSbom.ps1 `
            -Descriptor ./release-output/sessiondock-release.json `
            -Project ./release-input/application.csproj `
            -LockFile ./release-input/packages.lock.json `
            -License ./release-input/app/LICENSE.md `
            -BundledHandleScopeManifest ./release-input/handlescope-upstream.json `
            -Output "./release-output/SessionDock-$env:RELEASE_VERSION-sbom.spdx.json"
          & ./release-input/scripts/New-ReleaseChecksums.ps1 -Directory ./release-output

      - name: Verify the final release asset set
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate-and-build.outputs.tag }}
        run: |
          & ./release-input/scripts/Verify-Assets.ps1 `
            -Directory ./release-output `
            -Manifest ./release-output/sessiondock-release.json `
            -CompatibilityCatalog ./release-output/sessiondock-handlescope-compatibility.json `
            -ReleaseSigner ./release-input/signer/ReleaseSigner.exe `
            -PublicKey ./release-input/update-public-key.pem `
            -PublishedApplicationDirectory ./release-input/app `
            -ExpectedTag $env:RELEASE_TAG

      - name: Create a fresh draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-and-build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-and-build.outputs.version }}
        run: |
          $tag = $env:RELEASE_TAG
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -eq 0) {
            throw "Release $tag already exists. Remove only a failed unpublished draft before rerunning."
          }
          gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --draft `
            --title "SessionDock $env:RELEASE_VERSION" `
            --notes-file ./release-input/notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create the draft release.' }

      - name: Upload and independently verify draft assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-and-build.outputs.tag }}
        run: |
          $tag = $env:RELEASE_TAG
          $assets = @(Get-ChildItem release-output -File | Sort-Object Name)
          [string[]] $assetPaths = $assets.FullName
          & gh release upload $tag @assetPaths --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'Unable to upload draft release assets.' }

          New-Item -ItemType Directory verified-assets -Force | Out-Null
          gh release download $tag --repo $env:GITHUB_REPOSITORY --dir verified-assets --pattern '*'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download draft release assets for verification.' }

          $downloaded = @(Get-ChildItem verified-assets -File | Sort-Object Name)
          if ($downloaded.Count -ne $assets.Count) { throw 'Downloaded asset count does not match the upload.' }
          for ($index = 0; $index -lt $assets.Count; $index++) {
            if ($assets[$index].Name -cne $downloaded[$index].Name) { throw 'Downloaded asset names do not match the upload.' }
            $localHash = (Get-FileHash -LiteralPath $assets[$index].FullName -Algorithm SHA256).Hash
            $remoteHash = (Get-FileHash -LiteralPath $downloaded[$index].FullName -Algorithm SHA256).Hash
            if ($localHash -cne $remoteHash) { throw "Draft asset hash mismatch: $($assets[$index].Name)" }
          }

      - name: Attest the verified release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: verified-assets/*

  publish-verified-release:
    name: Approve and publish verified release
    needs:
      - validate-and-build
      - preflight-discord-announcement
      - sign-attest-and-stage
    runs-on: windows-latest
    timeout-minutes: 15
    environment: release-publication
    permissions:
      actions: read
      contents: write
      attestations: read
    steps:
      - name: Download immutable verification tools
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-${{ github.sha }}
          path: release-verification

      - name: Re-download and verify the approved draft
        id: verify-release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-and-build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-and-build.outputs.version }}
          EXPECTED_SIGNER_WORKFLOW: Makmatoe/SessionDock/.github/workflows/release.yml
          EXPECTED_SOURCE_REF: ${{ github.ref }}
          EXPECTED_SOURCE_DIGEST: ${{ github.sha }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if ($env:GITHUB_REPOSITORY -cne 'Makmatoe/SessionDock') {
            throw 'This workflow may publish only from Makmatoe/SessionDock.'
          }
          if ($env:EXPECTED_SOURCE_REF -cne "refs/tags/$env:RELEASE_TAG" -or
              $env:EXPECTED_SOURCE_DIGEST -cnotmatch '^[0-9a-f]{40}$') {
            throw 'The approved release provenance does not identify the expected tag commit.'
          }

          $releaseJson = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json body,isDraft,isPrerelease,tagName,name
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect the approved draft release.' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.tagName -cne $env:RELEASE_TAG -or
              $release.name -cne "SessionDock $env:RELEASE_VERSION") {
            throw 'The approved release does not have the expected immutable identity.'
          }
          if ($release.isPrerelease) {
            throw 'The approved release unexpectedly became a prerelease.'
          }
          function ConvertTo-NormalizedReleaseBody([string] $value) {
            if ($null -eq $value) { return '' }
            return (($value -replace "`r`n", "`n") -replace "`r", "`n").TrimEnd("`n")
          }
          $expectedBody = ConvertTo-NormalizedReleaseBody `
            (Get-Content -LiteralPath release-verification/notes.md -Raw)
          $actualBody = ConvertTo-NormalizedReleaseBody $release.body
          if ($actualBody -cne $expectedBody) {
            throw 'The approved release notes differ from the immutable release notes.'
          }
          [int] $runAttempt = 0
          if (-not [int]::TryParse($env:RELEASE_RUN_ATTEMPT, [ref] $runAttempt) -or $runAttempt -lt 1) {
            throw 'The GitHub workflow run attempt is invalid.'
          }
          if (-not $release.isDraft -and $runAttempt -eq 1) {
            throw 'The release became public before the first guarded publication attempt.'
          }

          New-Item -ItemType Directory approved-assets -Force | Out-Null
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --dir approved-assets --pattern '*'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download the approved draft assets.' }

          $expectedNames = @(
            'assets.win-x64-sessiondock.json'
            'RELEASES-win-x64-sessiondock'
            'releases.win-x64-sessiondock.json'
            "SessionDock-$env:RELEASE_VERSION-sbom.spdx.json"
            'sessiondock-handlescope-compatibility.json'
            'sessiondock-release.json'
            'SessionDock-win-x64-Portable.zip'
            'SessionDock-win-x64-Setup.exe'
            "SessionDockApp-$env:RELEASE_VERSION-win-x64-sessiondock-full.nupkg"
            'SHA256SUMS.txt'
          ) | Sort-Object
          $assets = @(Get-ChildItem approved-assets -File | Sort-Object Name)
          $actualNames = @($assets.Name | Sort-Object)
          if (Compare-Object $expectedNames $actualNames -CaseSensitive) {
            throw 'The approved draft asset inventory is not exact.'
          }

          $checksumPath = Join-Path approved-assets 'SHA256SUMS.txt'
          $checksumEntries = [Collections.Generic.Dictionary[string, string]]::new(
            [StringComparer]::Ordinal)
          foreach ($line in Get-Content -LiteralPath $checksumPath) {
            if ($line -cnotmatch '^([0-9a-f]{64})  ([A-Za-z0-9][A-Za-z0-9._-]*)$') {
              throw 'The approved draft checksum file is malformed.'
            }
            if ($checksumEntries.ContainsKey($Matches[2])) {
              throw "The approved draft checksum file repeats $($Matches[2])."
            }
            $checksumEntries.Add($Matches[2], $Matches[1])
          }
          $expectedChecksumNames = @($actualNames | Where-Object { $_ -cne 'SHA256SUMS.txt' })
          if (Compare-Object `
              $expectedChecksumNames `
              @($checksumEntries.Keys | Sort-Object) `
              -CaseSensitive) {
            throw 'The approved draft checksums do not cover the exact asset set.'
          }
          foreach ($name in $expectedChecksumNames) {
            $actualHash = (Get-FileHash -LiteralPath (Join-Path approved-assets $name) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -cne $checksumEntries[$name]) {
              throw "Approved draft checksum mismatch: $name"
            }
          }

          & ./release-verification/signer/ReleaseSigner.exe verify-catalog `
            --manifest ./approved-assets/sessiondock-handlescope-compatibility.json `
            --public-key ./release-verification/update-public-key.pem `
            --sessiondock-version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw 'Approved HandleScope compatibility catalog signature verification failed.'
          }

          foreach ($asset in $assets) {
            gh attestation verify $asset.FullName `
              --repo $env:GITHUB_REPOSITORY `
              --signer-workflow $env:EXPECTED_SIGNER_WORKFLOW `
              --source-ref $env:EXPECTED_SOURCE_REF `
              --source-digest $env:EXPECTED_SOURCE_DIGEST
            if ($LASTEXITCODE -ne 0) {
              throw "Approved draft attestation verification failed: $($asset.Name)"
            }
          }

          $releaseState = if ($release.isDraft) { 'draft' } else { 'public' }
          "state=$releaseState" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Create guarded publication intent
        if: steps.verify-release.outputs.state == 'draft'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate-and-build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-and-build.outputs.version }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_SOURCE_REF: ${{ github.ref }}
          EXPECTED_SOURCE_DIGEST: ${{ github.sha }}
        run: |
          [int] $runAttempt = 0
          if (-not [int]::TryParse($env:RELEASE_RUN_ATTEMPT, [ref] $runAttempt) -or $runAttempt -lt 1) {
            throw 'The GitHub workflow run attempt is invalid.'
          }
          $notesBytes = [IO.File]::ReadAllBytes(
            (Resolve-Path -LiteralPath release-verification/notes.md))
          $notesSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($notesBytes)).ToLowerInvariant()
          $intent = [ordered]@{
            schema = 'sessiondock-release-publication-intent/v1'
            repository = $env:GITHUB_REPOSITORY
            workflowRunId = $env:GITHUB_RUN_ID
            runAttempt = $runAttempt
            releaseTag = $env:RELEASE_TAG
            releaseVersion = $env:RELEASE_VERSION
            sourceRef = $env:EXPECTED_SOURCE_REF
            sourceCommit = $env:EXPECTED_SOURCE_DIGEST
            notesSha256 = $notesSha256
          }
          New-Item -ItemType Directory guarded-publication-intent -Force | Out-Null
          $intent | ConvertTo-Json | Set-Content `
            -LiteralPath guarded-publication-intent/intent.json `
            -Encoding utf8 `
            -NoNewline

      - name: Preserve the guarded publication intent
        if: steps.verify-release.outputs.state == 'draft'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-publication-intent-${{ github.sha }}-${{ github.run_attempt }}
          path: guarded-publication-intent/intent.json
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          overwrite: false
          retention-days: 30

      - name: Verify an earlier guarded publication intent
        id: prior-publication-intent
        if: steps.verify-release.outputs.state == 'public'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-and-build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-and-build.outputs.version }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          EXPECTED_SOURCE_REF: ${{ github.ref }}
          EXPECTED_SOURCE_DIGEST: ${{ github.sha }}
        run: |
          [int] $runAttempt = 0
          if (-not [int]::TryParse($env:RELEASE_RUN_ATTEMPT, [ref] $runAttempt) -or $runAttempt -le 1) {
            throw 'An already-public release requires evidence from an earlier guarded publication attempt.'
          }

          $intentPrefix = "release-publication-intent-$env:EXPECTED_SOURCE_DIGEST-"
          $candidates = [Collections.Generic.List[object]]::new()
          [int] $page = 1
          do {
            $artifactJson = gh api `
              -H 'Accept: application/vnd.github+json' `
              -H 'X-GitHub-Api-Version: 2022-11-28' `
              "/repos/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID/artifacts?per_page=100&page=$page"
            if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect earlier publication-intent artifacts.' }
            $artifactPage = $artifactJson | ConvertFrom-Json
            foreach ($artifact in @($artifactPage.artifacts)) {
              if (-not $artifact.expired -and
                  $artifact.name.StartsWith($intentPrefix, [StringComparison]::Ordinal)) {
                $attemptText = $artifact.name.Substring($intentPrefix.Length)
                [int] $artifactAttempt = 0
                if ([int]::TryParse($attemptText, [ref] $artifactAttempt) -and
                    $artifactAttempt -ge 1 -and
                    $artifactAttempt -lt $runAttempt) {
                  $candidates.Add([pscustomobject]@{
                      Name = $artifact.name
                      Attempt = $artifactAttempt
                    })
                }
              }
            }
            $pageCount = @($artifactPage.artifacts).Count
            $page++
          } while ($pageCount -eq 100)

          $candidate = $candidates | Sort-Object Attempt -Descending | Select-Object -First 1
          if ($null -eq $candidate) {
            throw 'No earlier guarded publication-intent artifact exists for this tag commit.'
          }
          New-Item -ItemType Directory prior-publication-intent -Force | Out-Null
          gh run download $env:GITHUB_RUN_ID `
            --repo $env:GITHUB_REPOSITORY `
            --name $candidate.Name `
            --dir prior-publication-intent
          if ($LASTEXITCODE -ne 0) { throw 'Unable to download the earlier publication intent.' }

          $intentFiles = @(Get-ChildItem prior-publication-intent -File -Recurse)
          if ($intentFiles.Count -ne 1 -or $intentFiles[0].Name -cne 'intent.json') {
            throw 'The earlier publication-intent artifact has an unexpected inventory.'
          }
          $intent = Get-Content -LiteralPath $intentFiles[0].FullName -Raw | ConvertFrom-Json
          $expectedProperties = @(
            'notesSha256'
            'releaseTag'
            'releaseVersion'
            'repository'
            'runAttempt'
            'schema'
            'sourceCommit'
            'sourceRef'
            'workflowRunId'
          ) | Sort-Object
          $actualProperties = @($intent.psobject.Properties.Name | Sort-Object)
          if (Compare-Object $expectedProperties $actualProperties -CaseSensitive) {
            throw 'The earlier publication intent has an unexpected schema.'
          }
          $notesBytes = [IO.File]::ReadAllBytes(
            (Resolve-Path -LiteralPath release-verification/notes.md))
          $expectedNotesSha256 = [Convert]::ToHexString(
            [Security.Cryptography.SHA256]::HashData($notesBytes)).ToLowerInvariant()
          if ($intent.schema -cne 'sessiondock-release-publication-intent/v1' -or
              $intent.repository -cne $env:GITHUB_REPOSITORY -or
              $intent.workflowRunId -cne $env:GITHUB_RUN_ID -or
              [int] $intent.runAttempt -ne $candidate.Attempt -or
              $intent.releaseTag -cne $env:RELEASE_TAG -or
              $intent.releaseVersion -cne $env:RELEASE_VERSION -or
              $intent.sourceRef -cne $env:EXPECTED_SOURCE_REF -or
              $intent.sourceCommit -cne $env:EXPECTED_SOURCE_DIGEST -or
              $intent.notesSha256 -cne $expectedNotesSha256) {
            throw 'The earlier publication intent does not match this exact release.'
          }
          'verified=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish the reverified draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-and-build.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate-and-build.outputs.version }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          PRIOR_PUBLICATION_INTENT_VERIFIED: ${{ steps.prior-publication-intent.outputs.verified }}
        run: |
          $catalogName = 'sessiondock-handlescope-compatibility.json'
          New-Item -ItemType Directory final-catalog-verification -Force | Out-Null
          gh release download $env:RELEASE_TAG `
            --repo $env:GITHUB_REPOSITORY `
            --dir ./final-catalog-verification `
            --pattern $catalogName
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to re-download the HandleScope catalog immediately before publication.'
          }
          $finalCatalogs = @(Get-ChildItem ./final-catalog-verification -File -Force)
          if ($finalCatalogs.Count -ne 1 -or $finalCatalogs[0].Name -cne $catalogName) {
            throw 'The final HandleScope catalog verification download is not exact.'
          }
          $approvedCatalogHash = (Get-FileHash `
            -LiteralPath ./approved-assets/sessiondock-handlescope-compatibility.json `
            -Algorithm SHA256).Hash
          $finalCatalogHash = (Get-FileHash `
            -LiteralPath $finalCatalogs[0].FullName `
            -Algorithm SHA256).Hash
          if ($finalCatalogHash -cne $approvedCatalogHash) {
            throw 'The HandleScope catalog changed after approved-draft verification.'
          }
          & ./release-verification/signer/ReleaseSigner.exe verify-catalog `
            --manifest $finalCatalogs[0].FullName `
            --public-key ./release-verification/update-public-key.pem `
            --sessiondock-version $env:RELEASE_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw 'Final HandleScope compatibility catalog signature verification failed.'
          }

          $releaseJson = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json body,isDraft,isPrerelease,tagName,name
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect the reverified release before publication.' }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.tagName -cne $env:RELEASE_TAG -or
              $release.name -cne "SessionDock $env:RELEASE_VERSION") {
            throw 'The reverified release identity changed before publication.'
          }
          if ($release.isPrerelease) {
            throw 'The reverified release unexpectedly became a prerelease.'
          }
          function ConvertTo-NormalizedReleaseBody([string] $value) {
            if ($null -eq $value) { return '' }
            return (($value -replace "`r`n", "`n") -replace "`r", "`n").TrimEnd("`n")
          }
          $expectedBody = ConvertTo-NormalizedReleaseBody `
            (Get-Content -LiteralPath release-verification/notes.md -Raw)
          $actualBody = ConvertTo-NormalizedReleaseBody $release.body
          if ($actualBody -cne $expectedBody) {
            throw 'The reverified release notes changed before publication.'
          }
          [int] $runAttempt = 0
          if (-not [int]::TryParse($env:RELEASE_RUN_ATTEMPT, [ref] $runAttempt) -or $runAttempt -lt 1) {
            throw 'The GitHub workflow run attempt is invalid.'
          }
          if (-not $release.isDraft) {
            if ($env:PRIOR_PUBLICATION_INTENT_VERIFIED -cne 'true') {
              throw 'The already-public release lacks verified evidence from an earlier guarded publication attempt.'
            }
            Write-Host 'A later run attempt reverified the already-public release and its earlier guarded publication intent; continuing to automatic announcement.'
            exit 0
          }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish the verified draft release.' }
          $publishedJson = gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --json body,isDraft,isPrerelease,tagName,name
          if ($LASTEXITCODE -ne 0) {
            throw 'The verified release publication could not be confirmed.'
          }
          $published = $publishedJson | ConvertFrom-Json
          $publishedBody = ConvertTo-NormalizedReleaseBody $published.body
          if ($published.isDraft -or
              $published.isPrerelease -or
              $published.tagName -cne $env:RELEASE_TAG -or
              $published.name -cne "SessionDock $env:RELEASE_VERSION" -or
              $publishedBody -cne $expectedBody) {
            throw 'The published release does not exactly match the reverified release.'
          }

  announce-published-release:
    name: Automatically announce the published release
    needs:
      - validate-and-build
      - publish-verified-release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-announcement
    permissions: {}
    steps:
      - name: Download immutable release input
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-input-${{ github.sha }}
          path: release-input

      - name: Install the pinned Node.js runtime
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.18.0
          package-manager-cache: false

      - name: Verify the deterministic announcement artifact
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate-and-build.outputs.tag }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          node ./release-input/release-automation.mjs verify
          --artifact-dir release-input/discord-announcement
          --expected-tag "$RELEASE_TAG"
          --expected-ref "$SOURCE_REF"
          --expected-commit "$SOURCE_COMMIT"

      - name: Upload the deterministic announcement artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discord-release-announcement-${{ github.sha }}-${{ github.run_attempt }}
          path: release-input/discord-announcement
          if-no-files-found: error
          include-hidden-files: false
          compression-level: 0
          overwrite: false
          retention-days: 30

      - name: Add the immutable announcement audit summary
        shell: bash
        run: cat ./release-input/discord-announcement/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post and verify Bota's release announcement
        shell: bash
        env:
          DISCORD_RELEASE_BOT_ID: ${{ vars.DISCORD_RELEASE_BOT_ID }}
          DISCORD_RELEASE_BOT_TOKEN: ${{ secrets.DISCORD_RELEASE_BOT_TOKEN }}
          DISCORD_RELEASE_CHANNEL_ID: ${{ vars.DISCORD_RELEASE_CHANNEL_ID }}
          DISCORD_RELEASE_ROLE_ID: ${{ vars.DISCORD_RELEASE_ROLE_ID }}
          RELEASE_TAG: ${{ needs.validate-and-build.outputs.tag }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          node ./release-input/release-automation.mjs post
          --artifact-dir release-input/discord-announcement
          --expected-tag "$RELEASE_TAG"
          --expected-ref "$SOURCE_REF"
          --expected-commit "$SOURCE_COMMIT"
          --receipt discord-release-receipt/receipt.json

      - name: Upload the verified delivery receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: discord-release-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: discord-release-receipt/receipt.json
          if-no-files-found: error
          include-hidden-files: false
          overwrite: false
          retention-days: 30
